# Nginx — www.weekendgate.com
# انسخ إلى: /etc/nginx/sites-available/weekendgate.com
# ثم: ln -s /etc/nginx/sites-available/weekendgate.com /etc/nginx/sites-enabled/
#      certbot --nginx -d weekendgate.com -d www.weekendgate.com -d api.weekendgate.com

upstream weekendgate_web {
  server 127.0.0.1:3012;
  keepalive 16;
}

upstream weekendgate_api {
  server 127.0.0.1:3011;
  keepalive 16;
}

# إعادة توجيه بدون www → www
server {
  listen 80;
  listen [::]:80;
  server_name weekendgate.com;
  return 301 https://www.weekendgate.com$request_uri;
}

# الواجهة
server {
  listen 80;
  listen [::]:80;
  server_name www.weekendgate.com;

  client_max_body_size 20m;

  location /_next/static/ {
    proxy_pass http://weekendgate_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://weekendgate_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# الـ API
server {
  listen 80;
  listen [::]:80;
  server_name api.weekendgate.com;

  client_max_body_size 20m;

  location / {
    proxy_pass http://weekendgate_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
