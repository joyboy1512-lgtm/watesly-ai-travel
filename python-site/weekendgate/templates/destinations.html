{% extends "base.html" %}
{% block title %}{{ c.nav_destinations }} · WeekendGate{% endblock %}
{% block content %}
<section class="py-wrap">
  <h1>{{ c.destinations_title }}</h1>
  <div class="dest-grid">
    {% for d in destinations %}
    <a class="shop-dest-card" href="/hotels/results?destination={{ d.code }}">
      <img src="{{ d.image }}" alt="">
      <strong>{{ d.city_ar if lang == 'ar' else d.city_en }}</strong>
      <p dir="ltr">{{ d.code }}</p>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
