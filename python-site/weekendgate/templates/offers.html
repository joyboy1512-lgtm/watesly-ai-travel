{% extends "base.html" %}
{% block title %}{{ c.nav_offers }} · WeekendGate{% endblock %}
{% block content %}
<section class="py-wrap">
  <h1>{{ c.offers_title }}</h1>
  <div class="offer-grid">
    {% for offer in offers %}
    <a class="shop-offer-card" href="{{ offer.href }}">
      <img src="{{ offer.image }}" alt="">
      <strong>{{ offer.title_ar if lang == 'ar' else offer.title_en }}</strong>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
